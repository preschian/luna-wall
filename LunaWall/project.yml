name: LunaWall
options:
  bundleIdPrefix: app.lunawall
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
targets:
  LunaWall:
    type: application
    platform: macOS
    sources:
      - path: LunaWall
        excludes:
          - Info.plist
          - LunaWall.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.lunawall.LunaWall
        PRODUCT_NAME: LunaWall
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: LunaWall/Info.plist
        CODE_SIGN_ENTITLEMENTS: LunaWall/LunaWall.entitlements
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: false
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_STRICT_CONCURRENCY: complete
